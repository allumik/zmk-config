# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Kyria OLED Display
# CONFIG_ZMK_DISPLAY=y

# Uncomment the following lines to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Add Mouse support
CONFIG_ZMK_POINTING=y

# Add Deep Sleep
CONFIG_ZMK_SLEEP=y
# 15 min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Bluetooth link quality: key repeats on the host were lost/late release
# reports (2026-09-27, new desk). Both are ZMK's documented remedies: max TX
# power (also strengthens the split link) and the connection-stability
# settings ZMK plans to make default.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
